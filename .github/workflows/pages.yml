name: Build and deploy leaseendlive.com
on:
  push:
    branches: [main]
  schedule:
    - cron: "5 10 * * *"   # 6:05 AM ET (EDT) daily: publishes episodes whose date has arrived
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build.py
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 5d6b005a61bf789cd287d31cc50d0c80
          command: deploy
  indexnow:
    # Tell Bing, Yandex, Seznam, Naver (IndexNow) about every URL after each deploy.
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - name: Ping IndexNow
        run: |
          python3 - <<'PY'
          import json, re, time, urllib.request
          site = json.load(open("content/site.json")); key = site.get("indexnow_key"); base = site["url"].rstrip("/")
          if not key: raise SystemExit("no key")
          time.sleep(60)  # give Cloudflare a minute to serve the new build
          xml = open("dist/sitemap.xml").read()
          urls = re.findall(r"<loc>([^<]+)</loc>", xml)
          body = json.dumps({"host": base.split("://")[1], "key": key, "keyLocation": f"{base}/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type": "application/json; charset=utf-8"})
          try: print(urllib.request.urlopen(req, timeout=30).status, len(urls), "urls")
          except Exception as e: print("indexnow:", e)
          PY
